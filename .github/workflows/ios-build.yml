name: Build Native iOS & Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the native build to TestFlight
        required: true
        default: true
        type: boolean

jobs:
  native-smoke:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 found on runner"
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-app/package-lock.json

      - name: Install native dependencies
        working-directory: native-app
        run: npm ci

      - name: Verify native project
        working-directory: native-app
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Generate iOS project
        working-directory: native-app
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: native-app/ios
        run: pod install

      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -workspace native-app/ios/WarRescue.xcworkspace \
            -scheme WarRescue \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath native-app/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Launch native app in Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes available | awk -F '[()]' '/iOS 26/{print $(NF-1); exit}')
          DEVICE=$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone 16 Pro/{print $(NF-1); exit}')
          if [ -z "$RUNTIME" ] || [ -z "$DEVICE" ]; then
            echo "::error::Required iOS simulator runtime or device type is unavailable"
            exit 1
          fi
          UDID=$(xcrun simctl create ci-warrescue-native "$DEVICE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          python3 - "$UDID" <<'PY'
          import subprocess, sys
          subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=240)
          PY
          APP="native-app/dd/Build/Products/Release-iphonesimulator/WarRescue.app"
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$UDID" com.warrescue.app
          sleep 12
          xcrun simctl io "$UDID" screenshot native-app/native-launch.png
          xcrun simctl spawn "$UDID" launchctl list | grep com.warrescue.app

      - name: Upload smoke build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-smoke
          path: |
            native-app/dd/Logs
            native-app/native-launch.png
          if-no-files-found: ignore

  build-native-ios:
    needs: native-smoke
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 found on runner"
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-app/package-lock.json

      - name: Install native dependencies
        working-directory: native-app
        run: npm ci

      - name: Generate iOS project
        working-directory: native-app
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: native-app/ios
        run: pod install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane multi_json

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$HOME/.private_keys/AuthKey.p8"
          echo "API_KEY_PATH=$HOME/.private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Setup signing keychain
        run: |
          KEYCHAIN_PASSWORD="ci_native_$(date +%s)"
          KEYCHAIN_PATH="$HOME/Library/Keychains/native-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build native IPA and optionally upload
        working-directory: native-app
        run: |
          if [ "${{ inputs.upload_to_testflight }}" = "true" ]; then
            fastlane release
          else
            fastlane build_only
          fi

      - name: Upload native IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WarRescue-Native-iOS
          path: native-app/WarRescue.ipa
          retention-days: 30
          if-no-files-found: ignore
