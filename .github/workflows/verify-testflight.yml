name: Verify latest TestFlight build

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          python -m pip install --quiet pyjwt cryptography requests
          python - <<'PY'
          import json, os, time
          import jwt, requests

          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              os.environ["ASC_PRIVATE_KEY"].replace("\\n", "\n"),
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"]},
          )
          response = requests.get(
              "https://api.appstoreconnect.apple.com/v1/builds",
              headers={"Authorization": f"Bearer {token}"},
              params={"filter[app]": "6774955063", "sort": "-uploadedDate", "limit": "3", "include": "preReleaseVersion"},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          versions = {item["id"]: item["attributes"].get("version") for item in payload.get("included", []) if item.get("type") == "preReleaseVersions"}
          output = []
          for item in payload.get("data", []):
              relation = item.get("relationships", {}).get("preReleaseVersion", {}).get("data") or {}
              attrs = item.get("attributes", {})
              output.append({
                  "version": versions.get(relation.get("id")),
                  "build": attrs.get("version"),
                  "processingState": attrs.get("processingState"),
                  "uploadedDate": attrs.get("uploadedDate"),
              })
          print(json.dumps(output, ensure_ascii=False))
          if payload.get("data"):
              latest_id = payload["data"][0]["id"]
              groups_response = requests.get(
                  "https://api.appstoreconnect.apple.com/v1/betaGroups",
                  headers={"Authorization": f"Bearer {token}"},
                  params={
                      "filter[app]": "6774955063",
                      "filter[builds]": latest_id,
                      "include": "betaTesters",
                      "limit": "50",
                      "limit[betaTesters]": "50",
                  },
                  timeout=30,
              )
              groups_response.raise_for_status()
              groups_payload = groups_response.json()
              included_testers = {
                  tester["id"]: tester.get("attributes", {}).get("email")
                  for tester in groups_payload.get("included", [])
                  if tester.get("type") == "betaTesters"
              }
              distribution = []
              for group in groups_payload.get("data", []):
                  tester_links = group.get("relationships", {}).get("betaTesters", {}).get("data", [])
                  distribution.append({
                      "group": group.get("attributes", {}).get("name"),
                      "targetTesterIncluded": any(
                          included_testers.get(link.get("id")) == "717082194@qq.com"
                          for link in tester_links
                      ),
                  })
              print("DISTRIBUTION=" + json.dumps(distribution, ensure_ascii=False))
          PY
