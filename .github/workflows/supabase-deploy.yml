name: Deploy Supabase (Edge Functions + Secrets)

# ? GitHub?Actions????? Run ???????????????????? Supabase?
# ??? GitHub Secret?????SUPABASE_ACCESS_TOKEN?supabase.com ? Account ? Access Tokens ???
# ????????????????????????????????? set_secret ???

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aurowjqmjofpitsmlhmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply native parity database migration
        run: |
          jq -Rs '{query: .}' migrations/20260720_native_parity.sql | \
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @- >/dev/null

      - name: Prepare functions (CLI ???? supabase/functions/)
        run: |
          mkdir -p supabase/functions
          cp -r functions/* supabase/functions/
          ls -1 supabase/functions

      - name: Deploy all edge functions
        run: |
          for d in supabase/functions/*/; do
            name=$(basename "$d")
            [ "$name" = "_shared" ] && continue
            echo "===== deploy $name ====="
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
          done

      - name: Enable phone OTP authentication
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"external_phone_enabled":true}' >/dev/null

      - name: Set function secrets (???????)
        run: |
          set_secret() {
            if [ -n "$2" ]; then
              supabase secrets set "$1=$2" --project-ref "$PROJECT_REF" >/dev/null 2>&1 && echo "? set $1" || echo "? set $1 ??"
            else
              echo "- ?? $1????"
            fi
          }
          # ?? AI / ??
          set_secret MEOO_PROJECT_API_KEY "${{ secrets.MEOO_PROJECT_API_KEY }}"
          set_secret CRON_SECRET "${{ secrets.CRON_SECRET }}"
          set_secret GOOGLE_MAPS_KEY "${{ secrets.GOOGLE_MAPS_KEY }}"
          # iOS ?? APNs
          set_secret APNS_KEY_ID "${{ secrets.APNS_KEY_ID }}"
          set_secret APNS_TEAM_ID "${{ secrets.APNS_TEAM_ID || secrets.APPLE_TEAM_ID }}"
          set_secret APNS_BUNDLE_ID "${{ secrets.APNS_BUNDLE_ID }}"
          set_secret APNS_AUTH_KEY "${{ secrets.APNS_AUTH_KEY }}"
          # ???? FCM
          set_secret FCM_SERVICE_ACCOUNT "${{ secrets.FCM_SERVICE_ACCOUNT }}"
          # SOS ??/?? Twilio
          set_secret TWILIO_ACCOUNT_SID "${{ secrets.TWILIO_ACCOUNT_SID }}"
          set_secret TWILIO_FROM_NUMBER "${{ secrets.TWILIO_FROM_NUMBER }}"
          set_secret TWILIO_KEY_SID "${{ secrets.TWILIO_KEY_SID }}"
          set_secret TWILIO_KEY_SECRET "${{ secrets.TWILIO_KEY_SECRET }}"
          set_secret RESEND_API_KEY "${{ secrets.RESEND_API_KEY }}"
          set_secret EMAIL_FROM "${{ secrets.EMAIL_FROM }}"
          # ???????? App Store Server API
          set_secret APPSTORE_ISSUER_ID "${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"
          set_secret APPSTORE_KEY_ID "${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}"
